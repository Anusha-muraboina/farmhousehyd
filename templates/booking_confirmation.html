{% extends "base.html" %}
{% block content %}

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<div id="box" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 via-white to-gray-100">
  <div class="text-center text-xl font-medium text-gray-600 animate-pulse">
    Loading your booking details...
  </div>
</div>

<template id="success-template">
  {% comment %} <div class="min-h-screen bg-gradient-to-b from-orange-50/40 via-white to-gray-50 py-10 px-4 sm:px-6 lg:px-8"> {% endcomment %}
  <div class="min-h-screen bg-gradient-to-b from-orange-50/40 via-white to-gray-50 py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-5xl mx-auto">

      <!-- Hero / Confirmation Banner -->
      <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-10 border border-green-100">

        <div class="bg-gradient-to-r from-orange-600 to-orange-300 px-8 py-12 text-center text-white relative">

          <!-- Optional subtle celebration dots -->
          <div class="absolute inset-0 opacity-10 pointer-events-none">
            <div class="absolute top-6 left-10 w-3 h-3 bg-white rounded-full animate-ping"></div>
            <div class="absolute top-20 right-16 w-2 h-2 bg-white rounded-full animate-ping delay-300"></div>
            <div class="absolute bottom-12 left-1/3 w-4 h-4 bg-white rounded-full animate-ping delay-700"></div>
          </div>

          <div class="relative">
            {% comment %} <div class="mx-auto w-20 h-20 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center text-5xl mb-6 shadow-lg">
              🎉
            </div> {% endcomment %}
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">
              Booking Confirmed!
            </h1>
            <p class="mt-4 text-lg md:text-xl text-green-100 font-light">
              Your farmhouse getaway is all set. We’re excited for you!
            </p>

            <div class="mt-8 inline-flex items-center gap-3 bg-white/25 backdrop-blur-md px-6 py-3 rounded-2xl border border-white/30">
              <span class="text-sm uppercase tracking-wider opacity-90">Booking ID</span>
              <span class="text-2xl md:text-3xl font-bold">${b.booking_id}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Main content grid -->
      <div class="grid lg:grid-cols-3 gap-7">

        <!-- Left column - Details -->
        <div class="lg:col-span-2 space-y-7">

          <!-- Farmhouse Card -->
          <div class="bg-white rounded-2xl shadow-md p-7 border border-gray-100 hover:shadow-lg transition-shadow">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-3">
              <span class="text-green-600 text-2xl"></span> Your Farmhouse
            </h2>
            <p class="text-2xl font-semibold text-gray-900">${b.farmhouse}</p>
          </div>

          <!-- Stay Details -->
          <div class="bg-white rounded-2xl shadow-md p-7 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-5">Stay Information</h2>
            <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">

              <div class="bg-gradient-to-br from-gray-50 to-white p-5 rounded-xl border border-gray-200 text-center">
                <p class="text-sm text-gray-500 mb-1">Check-in</p>
                <p class="text-lg font-semibold text-gray-900">${b.check_in}</p>
              </div>

              <div class="bg-gradient-to-br from-gray-50 to-white p-5 rounded-xl border border-gray-200 text-center">
                <p class="text-sm text-gray-500 mb-1">Check-out</p>
                <p class="text-lg font-semibold text-gray-900">${b.check_out}</p>
              </div>

              <div class="bg-gradient-to-br from-gray-50 to-white p-5 rounded-xl border border-gray-200 text-center">
                <p class="text-sm text-gray-500 mb-1">Nights</p>
                <p class="text-lg font-semibold text-gray-900">${nights}</p>
              </div>

              <div class="bg-gradient-to-br from-gray-50 to-white p-5 rounded-xl border border-gray-200 text-center">
                <p class="text-sm text-gray-500 mb-1">Guests</p>
                <p class="text-lg font-semibold text-gray-900">${b.guest_count}</p>
              </div>

            </div>
          </div>

          <!-- Guest Info -->
          <div class="bg-white rounded-2xl shadow-md p-7 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-5">Guest Details</h2>
            <div class="space-y-4 text-gray-700">
              <div class="flex justify-between">
                <span class="font-medium">Full Name</span>
                <span>${b.guest_name}</span>
              </div>
              <div class="flex justify-between">
                <span class="font-medium">Phone</span>
                <span>${b.guest_phone}</span>
              </div>
              <div class="flex justify-between">
                <span class="font-medium">Email</span>
                <span class="text-blue-600">${b.guest_email}</span>
              </div>
            </div>
          </div>

        </div>

        <!-- Right column - Payment Summary (sticky) -->
        <div class="lg:sticky lg:top-6 h-fit">
          <div class="bg-white rounded-2xl shadow-xl p-7 border border-green-100">

            <h2 class="text-2xl font-bold text-gray-900 mb-6">Payment Summary</h2>

            <div class="space-y-4 pb-6 border-b border-gray-200">

              <div class="flex justify-between text-gray-700">
                <span>Subtotal</span>
                <span>₹${b.sub_total}</span>
              </div>

              <div class="flex justify-between text-green-600 font-medium">
                <span>Discount</span>
                <span>- ₹${b.discount}</span>
              </div>

              <div class="flex justify-between text-red-600 font-medium">
                <span>Remaining</span>
                <span>₹${b.remaining_amount}</span>
              </div>

            </div>

            <div class="mt-6 flex justify-between items-center bg-gradient-to-r from-green-50 to-emerald-50 p-5 rounded-xl border border-green-200">
              <span class="text-md font-semibold text-gray-800">Total Amount</span>
              <span class="text-xl font-extrabold text-green-700">₹${b.total_amount}</span>
            </div>

            <a href="/farmhouses/"
               class="mt-8 block w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white text-center py-4 rounded-xl font-bold text-lg shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
              Explore Farmhouses →
            </a>

            {% comment %} <p class="text-center text-sm text-gray-500 mt-5">
              A copy of this confirmation has been sent to your email.
            </p> {% endcomment %}

          </div>
        </div>

      </div>

    </div>
  </div>
</template>

<script>

const bookingId = "{{ booking_id }}";

async function loadBooking() {
  try {
    const res = await axios.get(`/bookings/api/booking-success/${bookingId}/`);
    const b = res.data;

    const nights = Math.ceil(
      (new Date(b.check_out) - new Date(b.check_in)) / (1000 * 60 * 60 * 24)
    );

    const template = document.getElementById('success-template').innerHTML;
    const html = template
      .replace(/\${b\.booking_id}/g,    b.booking_id    || '—')
      .replace(/\${b\.farmhouse}/g,     b.farmhouse     || '—')
      .replace(/\${b\.check_in}/g,      b.check_in      || '—')
      .replace(/\${b\.check_out}/g,     b.check_out     || '—')
      .replace(/\${nights}/g,           nights)
      .replace(/\${b\.guest_count}/g,   b.guest_count   || '—')
      .replace(/\${b\.guest_name}/g,    b.guest_name    || '—')
      .replace(/\${b\.guest_phone}/g,   b.guest_phone   || '—')
      .replace(/\${b\.guest_email}/g,   b.guest_email   || '—')
      .replace(/\${b\.sub_total}/g,     Number(b.sub_total||0).toLocaleString('en-IN'))
      .replace(/\${b\.discount}/g,      Number(b.discount||0).toLocaleString('en-IN'))
      .replace(/\${b\.remaining_amount}/g, Number(b.remaining_amount||0).toLocaleString('en-IN'))
      .replace(/\${b\.total_amount}/g,  Number(b.total_amount||0).toLocaleString('en-IN'));

    document.getElementById("box").innerHTML = html;

  } catch (err) {
    console.error(err);
    document.getElementById("box").innerHTML = `
      <div class="text-center p-10">
        
        <h2 class="text-2xl font-bold text-red-600 mb-3">Something went wrong</h2>
        <p class="text-gray-600 mb-6">We couldn't load your booking details right now.</p>
        <a href="/bookings/" class="inline-block bg-red-600 text-white px-8 py-3 rounded-xl font-medium hover:bg-red-700">
          Go to Bookings
        </a>
      </div>`;
  }
}

loadBooking();

</script>

{% endblock %}
