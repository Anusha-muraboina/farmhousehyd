function getCookie(name) {

let cookieValue = null;

if (document.cookie && document.cookie !== '') {

const cookies = document.cookie.split(';');

for (let i = 0; i < cookies.length; i++) {

const cookie = cookies[i].trim();

if (cookie.substring(0, name.length + 1) === (name + '=')) {

cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
break;

}
}
}

return cookieValue;
}

axios.defaults.headers.common["X-CSRFToken"] = getCookie("csrftoken");

async function initFlatpickr(){

const res = await axios.get(
`/bookings/blocked-dates/${farmhouse.id}/`
);

const blockedRanges = res.data;

blockedCheckinDates = [];

blockedRanges.forEach(range => {

let start = new Date(range.from);
let end = new Date(range.to);

while(start <= end){

blockedCheckinDates.push(
start.toISOString().split("T")[0]
);

start.setDate(start.getDate()+1);
}

});

//////////////////////////////////////////////////
// CHECK-IN
//////////////////////////////////////////////////

flatpickr("#check_in",{

minDate:"today",
disable: blockedCheckinDates,
dateFormat:"Y-m-d",

onChange:function(selectedDates){

if(!selectedDates.length) return;

let nextDay = new Date(selectedDates[0]);
nextDay.setDate(nextDay.getDate()+1);

checkoutPicker.set("minDate",nextDay);

// 🔥 CLEAR OLD VALUE

});

async function applyCoupon(){

if(!coupon.value){
couponId=null;
couponDiscount=0;
calculateTotal();
return;
}

// ⭐ calculate first
calculateTotal();

try{

const res = await axios.get(
`/coupon/validate-coupon/?code=${coupon.value}&farmhouse=${farmhouse.id}&amount=${subTotal}`
);

if(res.data.valid){

couponId = res.data.id;

// ✅ USE discount (NOT value)
couponDiscount = Number(res.data.discount);

alert(res.data.message);

}else{

couponId=null;
couponDiscount=0;
alert(res.data.message);

}

}catch(err){

couponId=null;
couponDiscount=0;
alert("Coupon validation failed");

}

calculateTotal(); // recalc after discount
}

//////////////////////////////////////////////////
// PRICE CALCULATION
//////////////////////////////////////////////////
function calculateTotal(){

if(!check_in.value || !check_out.value) return;

let normal = Number(farmhouse.pricing.normal_day_price || 0);
let weekend = Number(farmhouse.pricing.weekend_price || 0);
let extra = Number(farmhouse.pricing.extra_guest_price || 0);

let start = new Date(check_in.value);
let end = new Date(check_out.value);

subTotal = 0;

while(start < end){

const day = start.getDay();

// Sunday = 0, Saturday = 6
subTotal += (day === 0 || day === 6)
? weekend
: normal;

start.setDate(start.getDate()+1);
}

// extra guest price
subTotal += Number(extra_guest_count.value || 0) * extra;

finalTotal = Math.max(subTotal - couponDiscount, 0);

console.log("Subtotal:", subTotal);
console.log("Final:", finalTotal);

// ⭐ ADD THIS (you forgot earlier)
<!-- fillReview(); -->
updatePayment();
}

////////////////////////////////////////////////

}

if(step === 3){

calculateTotal();

if(finalTotal <= 0){
alert("Invalid booking total");
return;
}

}

openSection(step+1);
}

if(finalTotal<=0){
alert("Invalid amount");
return;
}

const btn = document.getElementById("bookNowBtn");

////////////////////////////////////////////////

////////////////////////////////////////////////

btn.innerText = "Processing...";

try{

const method=
document.querySelector(
'input[name="payment"]:checked'
).value;

const payload={

farmhouse:farmhouse.id,

guest_name:guest_name.value,
guest_phone:guest_phone.value,
guest_email:guest_email.value,

guest_count:guest_count.value,
extra_guest_count:extra_guest_count.value,

check_in:check_in.value,
check_out:check_out.value,

coupon_applied: couponId || null,
payment_method:
method==="partial"
?"partial_razorpay"
:method==="full"
?"full_razorpay"
:"farmhouse"
};

const res = await axios.post(
"/bookings/create/",
payload
);

////////////////////////////////////////////////
//// PAY AT FARMHOUSE
////////////////////////////////////////////////

if(res.data.redirect_url){

window.location.href = res.data.redirect_url;
return;
}

////////////////////////////////////////////////
//// RAZORPAY
////////////////////////////////////////////////

hideLoader(); // 👈 IMPORTANT before popup

const razor = new Razorpay({

key:res.data.key,
amount:res.data.amount,
