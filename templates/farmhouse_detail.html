{% extends "base.html" %}
{% block title %}Farmhouse Detail{% endblock %}

{% block content %}

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  .gallery-thumb {
    height: 110px;
    width: 100%;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: .3s;
  }

  .gallery-thumb:hover {
    transform: scale(1.04);
  }

  .active-thumb {
    border-color: #f97316;
  }

    {
    % comment %
  }

  .main-image {
    height: 500px;
    width: 100%;
    object-fit: cover;
    border-radius: 18px;
  }

    {
    % endcomment %
  }

  .booking-card {
    background: white;
    padding: 26px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
  }

  .amenity-card {
    background: #fff7ed;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    font-weight: 600;
  }
</style>


<!-- LOADER -->
<div id="loader" class="text-center py-24 text-xl font-semibold">
  Loading Farmhouse...
</div>

<div id="farmhouse-container" style="display:none;"></div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>









<script>

async function bookFarmhouse(farmhouseId){

const payload = {
farmhouse_id:farmhouseId,
check_in:checkIn.value,
check_out:checkOut.value,
guest_name:name.value,
guest_email:email.value,
guest_phone:phone.value,
payment_method:payment.value
};

const res = await axios.post("/api/farmhouse-booking/", payload);


// ✅ CASH
if(res.data.redirect){
window.location.href = res.data.redirect;
return;
}


// ✅ ONLINE PAYMENT
const options = {

key:res.data.key,
amount:res.data.amount,
currency:"INR",
order_id:res.data.order_id,

name:"Vivaan Farmhouse",

handler:function(){

// DO NOT VERIFY HERE
// Webhook will do it safely

window.location.href="/payment-processing/";
},

modal:{
ondismiss:function(){
alert("Payment cancelled");
}
}

};

new Razorpay(options).open();

}


</script>









<script>

  async function loadFarmhouse() {

    const slug = "{{ slug }}";

    try {

      const res = await axios.get(`/api/farmhouses/${slug}/`);

      const f = res.data.farmhouse;

      if (!f) {
        document.getElementById("loader").innerText = "Farmhouse not found";
        return;
      }

      /* MAIN IMAGE */

      let mainImage = f.primary_image || f.images?.[0]?.image || "";


      /* THUMBNAILS */

      let thumbs = "";

      if (f.images?.length) {

        thumbs = f.images.slice(0, 4).map((img, i) => `
    <img src="${img.image}"
    class="gallery-thumb ${i === 0 ? 'active-thumb' : ''}"
    onclick="changeImage(this)">
    `).join("");

      } else {

        thumbs = `<p>No images available</p>`;

      }


      /* AMENITIES */

      let amenities = "No amenities available.";

      if (f.amenities?.length) {

        amenities = f.amenities.map(a => `
    <div class="amenity-card">
    <i data-lucide="${a.icon_class}" class="w-5 h-5 mx-auto mb-2"></i>
    ${a.name}
    </div>
    `).join("");

      }



      /* BUILD UI */

      document.getElementById("farmhouse-container").innerHTML = `

    <div class="container mx-auto px-4 py-10">

    <!-- ⭐ TOP GALLERY -->
    <div class="flex gap-6 mb-14 items-start">

    <!-- LEFT SMALL IMAGES -->
    <div class="flex flex-col gap-4 w-[150px] shrink-0">
    ${thumbs}
    </div>

    <!-- RIGHT BIG IMAGE -->
    <div class="flex-1">
    <img id="mainImage"
    src="${mainImage}"
    class=" h-[500px] w-full object-cover rounded-2xl shadow">
    </div>

    </div>



    <!-- ⭐ BOOKING + DETAILS -->
    <div class="grid lg:grid-cols-2 gap-16 items-start">




    <!-- LEFT BOOKING -->
    <div class="booking-card lg:sticky top-24">

    <h2 class="text-3xl font-bold text-green-600 mb-4">
    ₹${f.price_per_day}
    <span class="text-sm text-gray-500">/night</span>
    </h2>

    <button class="w-full bg-orange-600 hover:bg-orange-500 text-white py-4 rounded-xl font-bold mb-6">
    Book Now
    </button>

    <p class="text-gray-500 text-sm text-center">
    You won't be charged yet
    </p>

    </div>




    <!-- RIGHT DETAILS -->
    <div>

    <h1 class="text-4xl font-bold mb-3">
    ${f.title}
    </h1>

    <p class="flex items-center gap-2 text-gray-500 mb-6">
    <i data-lucide="map-pin"></i>
    ${f.location?.name || ""} • ${f.address || ""}
    </p>



    <div class="flex gap-10 mb-8 text-lg">

    <span class="flex items-center gap-2">
    <i data-lucide="bed"></i>
    ${f.bedrooms || 0}
    </span>

    <span class="flex items-center gap-2">
    <i data-lucide="home"></i>
    ${f.halls || 0}
    </span>

    <span class="flex items-center gap-2">
    <i data-lucide="snowflake"></i>
    ${f.ac_bedrooms || 0}
    </span>

    </div>



    <h2 class="text-2xl font-bold mb-2">
    About this farmhouse
    </h2>

    <p class="text-gray-700 leading-relaxed mb-10">
    ${f.description || "No description available"}
    </p>



    <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
    <i data-lucide="sparkles"></i>
    Amenities
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    ${amenities}
    </div>

    </div>

    </div>

    </div>
    `;


      document.getElementById("loader").style.display = "none";
      document.getElementById("farmhouse-container").style.display = "block";

      lucide.createIcons();

    } catch (err) {

      document.getElementById("loader").innerText = "Failed to load farmhouse";

    }

  }



  /* CHANGE IMAGE */

  function changeImage(el) {

    document.getElementById("mainImage").src = el.src;

    document.querySelectorAll(".gallery-thumb")
      .forEach(t => t.classList.remove("active-thumb"));

    el.classList.add("active-thumb");

  }

  loadFarmhouse();

</script>

{% endblock %}
