function getCookie(name) {

let cookieValue = null;

if (document.cookie && document.cookie !== '') {

const cookies = document.cookie.split(';');

for (let i = 0; i < cookies.length; i++) {

const cookie = cookies[i].trim();

if (cookie.substring(0, name.length + 1) === (name + '=')) {

cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
break;

}
}
}

return cookieValue;
}

axios.defaults.headers.common["X-CSRFToken"] = getCookie("csrftoken");

function initPaymentSelection(){

const radios = document.querySelectorAll(".payment-radio");

if(!radios.length) return;

// auto select first available
radios[0].checked = true;

// attach listeners
radios.forEach(radio=>{
radio.addEventListener("change", updatePayment);
});

updatePayment();
}

function calculateTotal(){

if(!check_in.value || !check_out.value) return;
let sale = Number(farmhouse.pricing.sale_price || 0);
let normal = Number(farmhouse.pricing.normal_day_price || 0);
let weekend = Number(farmhouse.pricing.weekend_price || 0);
let extra = Number(farmhouse.pricing.extra_guest_price || 0);

let start = new Date(check_in.value);
let end = new Date(check_out.value);

subTotal = 0;

while(start < end){

    let priceForDay = 0;

    //////////////////////////////////////////////////
    // ⭐ SALE PRICE OVERRIDES EVERYTHING
    //////////////////////////////////////////////////
    if(sale > 0){

        priceForDay = sale;

    }else{

        const day = start.getDay();

        priceForDay = (day === 0 || day === 6)
            ? weekend
            : normal;
    }

    subTotal += priceForDay;

    start.setDate(start.getDate()+1);




{% comment %} const day = start.getDay();

// Sunday = 0, Saturday = 6
subTotal += (day === 0 || day === 6)
? weekend
: normal;

start.setDate(start.getDate()+1); {% endcomment %}
}

// extra guest price
{% comment %} subTotal += Number(extra_guest_count.value || 0) * extra;

finalTotal = Math.max(subTotal - couponDiscount, 0); {% endcomment %}

function openSection(n){

    // close only bodies
    for(let i=1;i<=4;i++){
        document
        .getElementById("sec"+i)
        .classList.add("hidden");
    }

    // open selected body
    const section = document.getElementById("sec"+n);
    section.classList.remove("hidden");

    // ⭐ scroll nicely
    const header = section.previousElementSibling;

    const yOffset = -140;
    const y = header.getBoundingClientRect().top 
            + window.pageYOffset 
            + yOffset;

    window.scrollTo({
        top:y,
        behavior:"smooth"
    });

    if(n===3) fillReview();
}

}

}

////////////////////////////////////////////////

alert("Enter guest name");
return;
}

if(!guest_phone.value.trim()){
alert("Enter phone number");
return;
}

if(!guest_email.value.trim()){
alert("Enter email");
return;
}

// simple email validation
if(!guest_email.value.includes("@")){

}

}

////////////////////////////////////////////////

alert("Invalid booking total");
return;
}

}

openSection(step+1);
}
