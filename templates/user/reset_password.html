{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<section class="md:py-16 py-2 bg-gray-100 flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8">

    <!-- Title -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Reset Password 🔐</h1>
      <p class="text-gray-500 text-sm mt-1">
        Create a new secure password
      </p>
    </div>

    <!-- New Password -->
    <div class="mb-4 relative">
      <label class="text-sm font-medium text-gray-700">New Password</label>
      <input
        id="new_password"
        type="password"
        placeholder="Enter new password"
        autocomplete="new-password"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-orange-400 outline-none"
      />
      <button
        type="button"
        onclick="togglePassword('new_password')"
        class="absolute right-4 top-[38px] text-gray-400 hover:text-gray-600">
        {% comment %} 👁️ {% endcomment %}
      </button>
    </div>

    <!-- Confirm Password -->
    <div class="mb-6 relative">
      <label class="text-sm font-medium text-gray-700">Confirm Password</label>
      <input
        id="confirm_password"
        type="password"
        placeholder="Confirm new password"
        autocomplete="new-password"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-orange-400 outline-none"
      />
      <button
        type="button"
        onclick="togglePassword('confirm_password')"
        class="absolute right-4 top-[38px] text-gray-400 hover:text-gray-600">
        {% comment %} 👁️ {% endcomment %}
      </button>
    </div>

    <!-- Button -->
    <button
      onclick="resetPassword()"
      class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold transition">
      Update Password
    </button>

    <!-- Back -->
    <div class="text-center mt-6 text-sm text-gray-600">
      Remember your password?
      <a href="{% url 'login-page' %}"
         class="text-orange-500 font-semibold hover:underline">
        Back to login
      </a>
    </div>

  </div>
</section>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");
const reset_token = params.get("token");

function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}

function resetPassword() {
  fetch(`/user/forgot-password/?uid=${uid}&token=${reset_token}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      new_password: document.getElementById("new_password").value,
      confirm_password: document.getElementById("confirm_password").value
    })
  })
  .then(res => res.json())
  .then(data => {
    alert(data.message || data.error);

    if (data.message) {
      window.location.href = "{% url 'login-page' %}";
    }
  });
}
</script>

{% endblock %}
