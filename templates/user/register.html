{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<section class="md:py-14 py-2 bg-gray-100 flex items-center justify-center px-4">

  <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl p-8">

    <!-- Title -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Create Account</h1>
      <p class="text-gray-500 text-sm mt-1">
        Join us and get started
      </p>
    </div>

    <!-- Username -->
    <div class="mb-4">
      <label class="text-sm font-medium text-gray-700">Username</label>
      <input
        id="username"
        type="text"
        placeholder="Enter username"
        autocomplete="off"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-400 outline-none"
      />
    </div>

    <!-- Email -->
    <div class="mb-4">
      <label class="text-sm font-medium text-gray-700">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Enter email"
        autocomplete="off"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-400 outline-none"
      />
    </div>

    <!-- Phone -->
    <div class="mb-4">
      <label class="text-sm font-medium text-gray-700">Phone</label>
      <input
        id="phone"
        type="text"
        placeholder="Enter phone number"
        autocomplete="off"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-400 outline-none"
      />
    </div>

    <!-- Password -->
    <div class="mb-4 relative">
      <label class="text-sm font-medium text-gray-700">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Create password"
        autocomplete="new-password"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-orange-400 outline-none"
      />
      <button
        type="button"
        onclick="togglePassword('password')"
        class="absolute right-4 top-[38px] text-gray-400 hover:text-gray-600">
        {% comment %} 👁️ {% endcomment %}
      </button>
    </div>

    <!-- Confirm Password -->
    <div class="mb-6 relative">
      <label class="text-sm font-medium text-gray-700">Confirm Password</label>
      <input
        id="password2"
        type="password"
        placeholder="Confirm password"
        autocomplete="new-password"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-orange-400 outline-none"
      />
      <button
        type="button"
        onclick="togglePassword('password2')"
        class="absolute right-4 top-[38px] text-gray-400 hover:text-gray-600">
        {% comment %} 👁️ {% endcomment %}
      </button>
    </div>

    <!-- Register Button -->
    <button
      onclick="register()"
      class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold transition">
      Create Account
    </button>

    <!-- Login -->
    <div class="text-center mt-6 text-sm text-gray-600">
      Already have an account?
      <a href="{% url 'login-page' %}"
         class="text-orange-500 font-semibold hover:underline">
        Login
      </a>
    </div>

  </div>
</section>

<script>
function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}

async function register() {
  const res = await fetch("{% url 'user-register' %}", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: username.value,
      email: email.value,
      phone: phone.value,
      password: password.value,
      password2: password2.value
    })
  });

  const data = await res.json();

  if (res.ok) {
    alert("Account created successfully!");
    window.location.href = "{% url 'home' %}";
  } else {
    alert(JSON.stringify(data));
  }
}
</script>

{% endblock %}
