{% extends "base.html" %}
{% block title %}Login{% endblock %}


{% block content %}
<section class="bg-gray-100 flex items-center justify-center px-4 md:py-16 py-6">
{% csrf_token %}
  <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl md:p-8 p-6">

    <!-- Title -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
      <p class="text-gray-500 text-sm mt-1">Login to continue</p>
    </div>

    <!-- Email -->
    <div class="mb-4">
      <label class="text-sm font-medium text-gray-700">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="off"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-400 outline-none"
      />
    </div>

    <!-- Password -->
    <div class="mb-3 relative">
      <label class="text-sm font-medium text-gray-700">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="new-password"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-orange-400 outline-none"
      />

      <!-- Eye -->
      <button
        type="button"
        onclick="togglePassword()"
        class="absolute right-4 top-[42px] text-gray-400 hover:text-gray-600">
        <i data-lucide="eye" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Forgot -->
    <div class="text-right mb-5">
      <a href="{% url 'forgot-password-page' %}"
         class="text-sm text-orange-500 hover:underline">
        Forgot password?
      </a>
    </div>

    <!-- Login -->
    <button
      onclick="loginUser()"
      class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold transition">
      Login
    </button>

    <!-- Register -->
    <div class="text-center mt-6 text-sm text-gray-600">
      Don’t have an account?
      <a href="{% url 'register-page' %}"
         class="text-orange-500 font-semibold hover:underline">
        Register
      </a>
    </div>

  </div>
</section>

<script>
function togglePassword() {
  const input = document.getElementById("password");
  const icon = document.querySelector("[data-lucide]");

  if (input.type === "password") {
    input.type = "text";
    icon.setAttribute("data-lucide", "eye-off");
  } else {
    input.type = "password";
    icon.setAttribute("data-lucide", "eye");
  }

  lucide.createIcons();
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    const cookies = document.cookie.split(";");
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.startsWith(name + "=")) {
        cookieValue = decodeURIComponent(
          cookie.substring(name.length + 1)
        );
        break;
      }
    }
  }
  return cookieValue;
}

async function loginUser() {

  const csrfToken = getCookie("csrftoken");

  const res = await fetch("/user/login/", {
    method: "POST",
    credentials: "include",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": csrfToken
    },
    body: JSON.stringify({
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })
  });

  const data = await res.json();

  if (res.ok) {
    window.location.href = "/";
  } else {
    alert(data.error || "Invalid login");
  }
}

{% comment %} async function loginUser() {
  const res = await fetch("{% url 'user-login' %}", {
    method: "POST",
    credentials: "include",   // 🔥 REQUIRED FOR SESSION
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  });

  const data = await res.json();

  if (res.ok) {
    window.location.href = "{% url 'home' %}";
  } else {
    alert(data.error || "Invalid login");
  }
} {% endcomment %}

lucide.createIcons();
</script>

{% endblock %}
