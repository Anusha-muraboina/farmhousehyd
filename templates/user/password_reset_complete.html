{% extends "base.html" %}

{% block title %}Password Reset Complete - Farmhouses Hyderabad{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-3xl shadow-xl border border-gray-100 text-center">
        <div class="flex justify-center">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center">
                <i data-lucide="check-circle" class="w-8 h-8"></i>
            </div>
        </div>
        <h2 class="mt-6 text-3xl font-display font-bold text-secondary">
            Password Reset
        </h2>
        <p class="mt-2 text-sm text-gray-500">
            Your password has been successfully reset. You can now log in with your new password.
        </p>
        <div class="pt-6">
            <a href="{% url 'login' %}"
                class="inline-block w-full py-3 px-4 text-sm font-bold rounded-xl text-white bg-secondary hover:bg-black transition-all shadow-lg">
                Login Now
            </a>
        </div>
    </div>
</section>
{% endblock %}
