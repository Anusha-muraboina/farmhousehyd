{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<section class="md:py-16 bg-gray-100 flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8">

    <!-- Title -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Forgot Password 🔒</h1>
      <p class="text-gray-500 text-sm mt-1">
        We’ll send you a reset link to your email
      </p>
    </div>

    <!-- Email -->
    <div class="mb-6">
      <label class="text-sm font-medium text-gray-700">Email address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your registered email"
        autocomplete="off"
        class="w-full mt-1 border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-400 outline-none"
      />
    </div>

    <!-- Button -->
    <button
      onclick="sendLink()"
      class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold transition">
      Send Reset Link
    </button>

    <!-- Back to login -->
    <div class="text-center mt-6 text-sm text-gray-600">
      Remember your password?
      <a href="{% url 'login-page' %}"
         class="text-orange-500 font-semibold hover:underline">
        Back to login
      </a>
    </div>

  </div>
</section>

<script>
async function sendLink() {
  const res = await fetch("{% url 'forgot-password' %}", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: email.value
    })
  });

  const data = await res.json();

  alert(data.message || data.error);
}
</script>
{% endblock %}
