<!DOCTYPE html>
<html>
<head>
    <title>{{ farmhouse.title }} Calendar</title>

    <style>
        body {
            font-family: Arial;
            background: #f9fafb;
            padding:5px 20px;
        }
:root {
    --primary: #f97316;        /* main orange */
    --primary-dark: #ea580c;   /* hover */
}

/* 🔥 HEADINGS */
h2, h3, #monthYear {
    color: var(--primary);
    font-weight: 700;
}
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-box {
            height: 90px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 8px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.2s;
        }

        .day-box:hover {
            transform: scale(1.03);
        }

        /* 🔴 BOOKED */
        .booked {
            background: #ef4444;
            color: white;
            border: 2px solid red;
        }

        /* ⚫ BLOCKED */
        .blocked {
            background: #9ca3af;
            color: white;
            border: 2px solid gray;
        }

        /* 🚫 DISABLED */
        .disabled {
            pointer-events: none;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .price {
            font-size: 12px;
            text-align: right;
        }

        .date {
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 8px 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .available {
    background: #dcfce7;   /* light green */
    border: 2px solid #22c55e;
}
    </style>
</head>

<body>

<h3>{{ farmhouse.title }}</h3>

<div style="display:flex; gap:15px; margin-bottom:15px; flex-wrap:wrap;">

    <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:15px; height:15px; background:#ef4444; border-radius:4px;"></div>
        <span>Booked</span>
    </div>

    <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:15px; height:15px; background:#9ca3af; border-radius:4px;"></div>
        <span>Blocked</span>
    </div>

    <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:15px; height:15px; background:#ffffff; border-radius:4px;"></div>
        <span>Available</span>
    </div>

    <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:15px; height:15px; background:#facc15; border-radius:4px;"></div>
        <span>Offer Price</span>
    </div>

</div>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <button onclick="prevMonth()">⬅ Prev</button>
    <h3 id="monthYear"></h3>
    <button onclick="nextMonth()">Next ➡</button>
</div>
<div class="week-row">
    <div>Sun</div><div>Mon</div><div>Tue</div>
    <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>

<div id="calendarGrid" class="calendar-grid"></div>

<button onclick="shareCalendar()">Share Calendar</button>

    navigator.clipboard.writeText(url);
    alert("Calendar link copied!");

</script> {% endcomment %}
<script>
function shareCalendar(){

    const url = `${window.location.origin}/calendar/{{ farmhouse.slug }}/`;

    // 🔥 TRY MODERN API
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url)
            .then(() => alert("✅ Link copied!"))
            .catch(() => fallbackCopy(url));
    } else {
        fallbackCopy(url);
    }
}

// 🔥 FALLBACK (ALWAYS WORKS)
function fallbackCopy(text) {
    const input = document.createElement("input");
    input.value = text;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    document.body.removeChild(input);

    alert("✅ Link copied (fallback)!");
}

</script>



<script>

let currentDate = new Date();

function updateMonthTitle(){
    const monthYear = document.getElementById("monthYear");
    monthYear.innerText = currentDate.toLocaleString('default', {
        month: 'long',
        year: 'numeric'
    });
}

function nextMonth(){
    currentDate.setMonth(currentDate.getMonth() + 1);
    loadCalendar();
}

function prevMonth(){
    currentDate.setMonth(currentDate.getMonth() - 1);
    loadCalendar();
}

{% comment %} async function loadCalendar(){
    try {
        const res = await fetch(`/bookings/blocked-dates/{{ farmhouse.slug }}/`);
        const data = await res.json();
        renderCalendar(data);
    } catch (e){
        console.error("Error:", e);
        renderCalendar([]);
    }
} {% endcomment %}



async function loadCalendar(){

    let year = currentDate.getFullYear();
    let month = currentDate.getMonth() + 1;

    try {
        const res = await fetch(
            `/calendar/data/{{ farmhouse.slug }}/?year=${year}&month=${month}`
        );

        const data = await res.json();
        renderCalendar(data);

    } catch (e){
        console.error("Error:", e);
        renderCalendar([]);
    }
}


function renderCalendar(data){

    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    updateMonthTitle();

    let year = currentDate.getFullYear();
    let month = currentDate.getMonth();

    let firstDay = new Date(year, month, 1).getDay();
    let daysInMonth = new Date(year, month + 1, 0).getDate();

    for(let i=0;i<firstDay;i++){
        grid.innerHTML += `<div></div>`;
    }

    for(let day=1; day<=daysInMonth; day++){

        let dateObj = new Date(year, month, day);

        let dateStr = dateObj.getFullYear() + "-" +
                      String(dateObj.getMonth()+1).padStart(2,'0') + "-" +
                      String(dateObj.getDate()).padStart(2,'0');

        let found = data.filter(d => d?.date === dateStr);

        let statusClass = "";
        let label = "";
        let price = null;
        let isOffer = false;

        if(found.length){

            // ✅ PRIORITY
            if(found.some(f => f.type === "booked")){
                statusClass = "booked disabled";
                label = "❌ Booked";
            }
            else if(found.some(f => f.type === "blocked")){
                statusClass = "blocked disabled";
                label = "🚫 Blocked";
            }

            // ✅ PRICE
            let priceObj = found.find(f => f.price !== undefined);

            if(priceObj){
                price = priceObj.price;
                isOffer = priceObj.is_offer;
            }
        }

        let div = document.createElement("div");
        div.className = `day-box ${statusClass}`;

        let priceDisplay = "";

        if(label){
            priceDisplay = label;
        }
        else if(price === null || price === undefined){
            priceDisplay = "";   // ✅ FIX ₹null
        }
        else if(isOffer){
            priceDisplay = `🔥 ₹${price}`;
        }
        else {
            priceDisplay = `₹${price}`;
        }

        div.innerHTML = `
            <div class="date">${day}</div>
            <div class="price">${priceDisplay}</div>
        `;

        grid.appendChild(div);
    }
}

document.addEventListener("DOMContentLoaded", loadCalendar);

</script>

</body>
</html>
