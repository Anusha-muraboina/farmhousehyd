<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Farmhouse</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-2xl rounded-2xl p-10 w-[400px]">

<h1 class="text-2xl font-bold text-orange-500 text-center mb-2">
Farmhouse Management
</h1>

<p class="text-gray-500 text-center mb-6">
Login to continue
</p>

<form method="POST">
{% csrf_token %}

<input name="email"
type="email"
placeholder="Enter your email"
required
class="w-full border p-3 rounded-lg mb-4 focus:ring-2 focus:ring-orange-400 outline-none">

<input name="password"
type="password"
placeholder="Enter your password"
required
class="w-full border p-3 rounded-lg mb-3 focus:ring-2 focus:ring-orange-400 outline-none">

{% for message in messages %}

<p class="text-red-500 text-sm mb-2">
{{ message }}
</p>
{% endfor %}

<button class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-lg font-semibold transition">
Login
</button>

</form>

</div>

</body>
</html>
