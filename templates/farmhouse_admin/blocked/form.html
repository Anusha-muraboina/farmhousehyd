{% extends "farmhouse_admin/base.html" %}
{% block content %}

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<div class="container-fluid">

<div class="card shadow-sm border-0 mx-auto"
style="max-width:750px;">

<div class="card-body p-5">

<h4 class="fw-bold mb-4">
Block Farmhouse Dates
</h4>

<form method="post">
{% csrf_token %}

<!-- FARMHOUSE -->
<div class="mb-3">
<label class="form-label fw-semibold">
Farmhouse
</label>
{{ form.farmhouse }}
</div>

<!-- START -->
<div class="mb-3">
<label class="form-label fw-semibold">
Start Date
</label>
{{ form.start_date }}
</div>

<!-- END -->
<div class="mb-3">
<label class="form-label fw-semibold">
End Date
</label>
{{ form.end_date }}
</div>

<!-- REASON -->
<div class="mb-4">
<label class="form-label fw-semibold">
Reason
</label>
{{ form.reason }}
</div>

<button class="btn btn-danger px-4">
<i class="fa fa-ban me-2"></i>
Save Blocked Dates
</button>

<a href="{% url 'blocked-dates' %}"
class="btn btn-light ms-2">
Cancel
</a>

</form>

</div>
</div>
</div>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<script>
document.addEventListener("DOMContentLoaded", function(){

    const farmhouse = document.getElementById("id_farmhouse");
    const startInput = document.getElementById("id_start_date");
    const endInput = document.getElementById("id_end_date");

    let startPicker;
    let endPicker;
    let blockedRanges = [];

    ////////////////////////////////////////////
    // 🔥 Convert string to YYYY-MM-DD
    ////////////////////////////////////////////

    function formatDate(date){
        return date.toISOString().split("T")[0];
    }

    ////////////////////////////////////////////
    // 🔥 Flatpickr disable logic
    ////////////////////////////////////////////

    function disableDates(date){

        const d = formatDate(date);

        return blockedRanges.some(range => {

            // ⭐ inclusive blocking
            return d >= range.from && d < range.to;
        });
    }

    ////////////////////////////////////////////
    // 🔥 Init calendar
    ////////////////////////////////////////////

    function initCalendar(){

        if(startPicker) startPicker.destroy();
        if(endPicker) endPicker.destroy();

        startPicker = flatpickr(startInput,{
            dateFormat:"Y-m-d",
            minDate:"today",
            disable:[disableDates],
            onChange:function(selectedDates){

                if(!selectedDates.length) return;

                let nextDay = new Date(selectedDates[0]);
                nextDay.setDate(nextDay.getDate()+1);

                endPicker.set("minDate", nextDay);
                endInput.value="";
            }
        });

        endPicker = flatpickr(endInput,{
            dateFormat:"Y-m-d",
            minDate:new Date().fp_incr(1),
            disable:[disableDates]
        });
    }

    ////////////////////////////////////////////
    // 🔥 Load blocked ranges from API
    ////////////////////////////////////////////

    function loadBlockedDates(farmhouseId){

        if(!farmhouseId){
            blockedRanges = [];
            initCalendar();
            return;
        }

        fetch(`/farmhouse_admin/blocked-ranges/?farmhouse=${farmhouseId}`)
        .then(res => res.json())
        .then(data => {

            console.log("Blocked:", data); // debug

            blockedRanges = data.map(r => ({
                from: r.from,
                to: r.to
            }));

            initCalendar();
        });
    }

    ////////////////////////////////////////////
    // 🔥 Events
    ////////////////////////////////////////////

    farmhouse?.addEventListener("change", function(){
        loadBlockedDates(this.value);
    });

    if(farmhouse?.value){
        loadBlockedDates(farmhouse.value);
    } else {
        initCalendar();
    }

});
</script>




{% comment %} <script>

flatpickr("#id_start_date",{
dateFormat:"Y-m-d",
minDate:"today"
});

flatpickr("#id_end_date",{
dateFormat:"Y-m-d",
minDate:"today"
});

</script> {% endcomment %}

{% endblock %}
