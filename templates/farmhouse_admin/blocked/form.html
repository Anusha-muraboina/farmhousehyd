{% extends "farmhouse_admin/base.html" %}
{% block content %}

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<div class="container-fluid">

<div class="card shadow-sm border-0 mx-auto"
style="max-width:750px;">

<div class="card-body p-5">

<h4 class="fw-bold mb-4">
Block Farmhouse Dates
</h4>

<form method="post">
{% csrf_token %}

<!-- FARMHOUSE -->
<div class="mb-3">
<label class="form-label fw-semibold">
Farmhouse
</label>
{{ form.farmhouse }}
</div>

<!-- START -->
<div class="mb-3">
<label class="form-label fw-semibold">
Start Date
</label>
{{ form.start_date }}
</div>

<!-- END -->
<div class="mb-3">
<label class="form-label fw-semibold">
End Date
</label>
{{ form.end_date }}
</div>

<!-- REASON -->
<div class="mb-4">
<label class="form-label fw-semibold">
Reason
</label>
{{ form.reason }}
</div>

<button class="btn btn-danger px-4">
<i class="fa fa-ban me-2"></i>
Save Blocked Dates
</button>

<a href="{% url 'blocked-dates' %}"
class="btn btn-light ms-2">
Cancel
</a>

</form>

</div>
</div>
</div>


<script>

flatpickr("#id_start_date",{
dateFormat:"Y-m-d",
minDate:"today"
});

flatpickr("#id_end_date",{
dateFormat:"Y-m-d",
minDate:"today"
});

</script>

{% endblock %}
