<!DOCTYPE html>

<html lang="en">
<head>

<title>Owner Panel</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family:Inter,sans-serif;
background:#f6f8fb;
margin:0;
}

/* HEADER */
.header{
background:#fff;
border-bottom:1px solid #eee;
{% comment %} position:sticky; {% endcomment %}
top:0;
z-index:1000;
}

.brand{
color:#ff7a00;
font-weight:700;
}

/* SIDEBAR */
.sidebar{
width:240px;
background:#fff;
min-height:100vh;
border-right:1px solid #eee;
padding:18px 12px;
}

/* MENU LINKS */
.sidebar a{
display:flex;
align-items:center;
gap:14px;
padding:13px 16px;
border-radius:12px;
color:#374151;
text-decoration:none;
font-weight:500;
}

.sidebar i{
width:22px;
font-size:18px;
}

/* HOVER */
.sidebar a:hover{
background:#fff4e5;
color:#ff7a00;
}

/* ACTIVE */
.sidebar a.active-parent{
background:#fff4e5;
color:#ff7a00;
}

/* CONTENT */
.content{
width:100%;
padding:28px;
}

/* OFFCANVAS MENU STYLE */
.offcanvas .sidebar{
width:100%;
border-right:none;
padding:12px;
min-height:auto;
}


/* ===========================
PAGINATION STYLE
=========================== */

.pagination{
gap:6px;
}

.pagination .page-link{
color:#ff7a00;
border:1px solid #ffe2c4;
padding:8px 14px;
border-radius:10px;
font-weight:600;
}

.pagination .page-link:hover{
background:#fff3e8;
color:#ff7a00;
border-color:#ffb347;
}

.pagination .active .page-link{
background:linear-gradient(135deg,#ff7a00,#ffb347);
border-color:#ff7a00;
color:white;
}

.pagination .page-link:focus{
box-shadow:none;
}
</style>

</head>

<body>

<!-- HEADER -->

<nav class="navbar header px-4 py-3 d-flex justify-content-between">

<div class="d-flex align-items-center gap-3">

<!-- MOBILE MENU BUTTON -->

<button class="btn btn-light d-md-none"
data-bs-toggle="offcanvas"
data-bs-target="#mobileSidebar">

<i class="fa-solid fa-bars"></i>

</button>

<h5 class="mb-0  brand">Farmhouse Owner</h5>

</div>

<div class="dropdown">

<button class="btn d-flex align-items-center gap-2"
data-bs-toggle="dropdown">

<div class="bg-warning text-white rounded-circle d-flex align-items-center justify-content-center"
style="width:36px;height:36px;">

{{ request.user.username|first|upper }}

</div>

{% comment %} {{ request.user.username }} {% endcomment %}

</button>

<ul class="dropdown-menu dropdown-menu-end">

<li>
<a class="dropdown-item" href="#">
Profile
</a>
</li>

<li>
<a class="dropdown-item text-danger"
href="{% url 'accounts:logout' %}">
Logout
</a>
</li>

</ul>

</div>

</nav>

<!-- MOBILE OFFCANVAS -->

<div class="offcanvas offcanvas-start d-md-none"
tabindex="-1"
id="mobileSidebar">

<div class="offcanvas-header">

<h6 class="brand">Farmhouse Owner</h6>

<button type="button"
class="btn-close"
data-bs-dismiss="offcanvas"></button>

</div>

<div class="offcanvas-body p-0">

<div class="sidebar">

<a href="{% url 'owner_dashboard' %}">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</a>

<a href="{% url 'owner_blocked-dates' %}">
<i class="fa-solid fa-tags"></i>
Blocked Dates
</a>

<a href="{% url 'owner_farmhouses' %}">
<i class="fa-solid fa-building"></i>
Farmhouses
</a>

<a href="{% url 'owner_bookings' %}">
<i class="fa-solid fa-calendar-check"></i>
Bookings
</a>

<a href="{% url 'owner_payment_policy_list' %}">
<i class="fa-solid fa-credit-card"></i>
Payment
</a>

<a href="{% url 'owner_contact_list' %}">
<i class="fa-solid fa-envelope"></i>
Messages
</a>

<a href="{% url 'owner_coupon_list' %}">
<i class="fa-solid fa-tags"></i>
Coupons
</a>

</div>

</div>

</div>

<div class="d-flex">

<!-- DESKTOP SIDEBAR -->

<aside class="sidebar d-none d-md-block">

<a href="{% url 'owner_dashboard' %}"
class="{% if request.resolver_match.url_name == 'owner_dashboard' %}active-parent{% endif %}">

<i class="fa-solid fa-chart-line"></i>
Dashboard

</a>

<a href="{% url 'owner_blocked-dates' %}"
class="{% if request.resolver_match.url_name in 'owner_blocked-dates owner_blocked-dates-create owner_blocked-dates-update' %}active-parent{% endif %}">

<i class="fa-solid fa-tags"></i>
Blocked Dates

</a>

<a href="{% url 'owner_farmhouses' %}"
class="{% if request.resolver_match.url_name in 'owner_farmhouses owner_farmhouse_create owner_farmhouse_update' %}active-parent{% endif %}">

<i class="fa-solid fa-building"></i>
Farmhouses

</a>

<a href="{% url 'owner_bookings' %}"
class="{% if request.resolver_match.url_name in 'owner_bookings owner_booking_detail' %}active-parent{% endif %}">

<i class="fa-solid fa-calendar-check"></i>
Bookings

</a>

<a href="{% url 'owner_payment_policy_list' %}">

<i class="fa-solid fa-credit-card"></i>
Payment

</a>

<a href="{% url 'owner_contact_list' %}">

<i class="fa-solid fa-envelope"></i>
Messages

</a>

<a href="{% url 'owner_coupon_list' %}"
class="{% if request.resolver_match.url_name in 'owner_coupon_list owner_coupon_create owner_coupon_update' %}active-parent{% endif %}">

<i class="fa-solid fa-tags"></i>
Coupons

</a>

</aside>

<!-- PAGE CONTENT -->

<main class="content">

{% block content %}{% endblock %}

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
