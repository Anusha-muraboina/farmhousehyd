<!DOCTYPE html>
<html lang="en">
<head>
<title>Owner Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Inter',sans-serif;
    background:#f6f8fb;
    margin:0;
}

/* HEADER */
.header{
    background:#fff;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    z-index:1000;
}

.brand{
    color:#ff7a00;
    font-weight:700;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    background:#fff;
    min-height:100vh;
    border-right:1px solid #eee;
    padding:18px 12px;
    transition:.35s ease;
}

/* DESKTOP COLLAPSE */
.sidebar.collapsed{
    width:78px;
}

.sidebar.collapsed .menu-text,
.sidebar.collapsed .arrow{
    display:none;
}

.sidebar.collapsed a{
    justify-content:center;
}

/* MENU */
.sidebar a{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 16px;
    border-radius:12px;
    color:#374151;
    text-decoration:none;
    transition:.25s;
    font-weight:500;
}

.sidebar i{
    width:22px;
    font-size:18px;
    text-align:center;
}

/* ACTIVE */
.sidebar a.active-parent{
    background:#fff4e5;
    color:#ff7a00;
}

.sidebar a.active-parent::before{
    content:"";
    position:absolute;
    left:-12px;
    top:8px;
    height:70%;
    width:5px;
    border-radius:6px;
    background:#ff7a00;
}

/* HOVER */
.sidebar a:hover{
    background:#fff4e5;
    color:#ff7a00;
}

/* SUBMENU */
.submenu{
    padding-left:12px;
    margin-top:6px;
}

.submenu a{
    font-size:14px;
    padding:9px 14px;
    margin-bottom:4px;
}

.rotate{
    transform:rotate(180deg);
}

/* CONTENT */
.content{
    width:100%;
    padding:28px;
}

/* OVERLAY */
#sidebarOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:998;
}

/* MOBILE SIDEBAR */
@media(max-width:768px){

.sidebar{
    position:fixed;
    left:-240px;
    top:0;
    height:100%;
    z-index:999;
}

/* slide in */
.sidebar.show{
    left:0;
}

/* IMPORTANT — disable collapsed on mobile */
.sidebar.collapsed{
    width:240px;
}

#sidebarOverlay.active{
    opacity:1;
    pointer-events:auto;
}

}

</style>
</head>

<body>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- HEADER -->
<nav class="navbar header px-4 py-3 d-flex justify-content-between">

<div class="d-flex align-items-center gap-3">
<button class="btn btn-light" onclick="toggleSidebar()">
<i class="fa-solid fa-bars"></i>
</button>

<h5 class="mb-0 brand">Farmhouse Owner</h5>
</div>

<div class="dropdown">
<button class="btn d-flex align-items-center gap-2" data-bs-toggle="dropdown">
<div class="bg-warning text-white rounded-circle d-flex align-items-center justify-content-center"
style="width:36px;height:36px;">
{{ request.user.username|first|upper }}
</div>
{{ request.user.username }}
</button>

<ul class="dropdown-menu dropdown-menu-end">
<li><a class="dropdown-item" href="#">Profile</a></li>
<li><a class="dropdown-item text-danger" href="{% url 'accounts:logout' %}">Logout</a></li>
</ul>
</div>

</nav>


<div class="d-flex">
<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

<a href="{% url 'owner_dashboard' %}" class="{% if request.resolver_match.url_name == 'owner_dashboard' %}active-parent{% endif %}">
<i class="fa-solid fa-chart-line"></i>
<span class="menu-text">Dashboard</span>
</a>


<a href="{% url 'owner_blocked-dates' %}" class="{% if request.resolver_match.url_name in 'owner_blocked-dates owner_blocked-dates-create owner_blocked-dates-update' %}active-parent{% endif %}">
<i class="fa-solid fa-tags"></i>
<span class="menu-text">Blocked Dates</span>
</a>

<a href="{% url 'owner_farmhouses' %}" class="{% if request.resolver_match.url_name in 'owner_farmhouses owner_farmhouse_create owner_farmhouse_update' %}active-parent{% endif %}">
<i class="fa-solid fa-building"></i>
<span class="menu-text">Farmhouses</span>
</a>

<!-- BOOKINGS -->
<a onclick="toggleMenu('bookingMenu',this)" class="{% if request.resolver_match.url_name in 'owner_bookings owner_booking_detail' %}active-parent{% endif %}">
<i class="fa-solid fa-calendar-check"></i>
<span class="menu-text">Bookings</span>
<i class="fa-solid fa-chevron-down arrow ms-auto"></i>
</a>

<div id="bookingMenu" class="submenu {% if request.resolver_match.url_name in 'owner_bookings owner_booking_detail' %}{% else %}d-none{% endif %}">
<a href="{% url 'owner_bookings' %}">
<i class="fa-solid fa-tags"></i>
All Bookings
</a>
</div>

<a onclick="toggleMenu('contactMenu',this)" class="{% if request.resolver_match.url_name in 'owner_contact_list owner_contact_detail' %}active-parent{% endif %}">
<i class="fa-solid fa-envelope"></i>
<span class="menu-text">Messages</span>
<i class="fa-solid fa-chevron-down arrow ms-auto"></i>
</a>

<div id="contactMenu" class="submenu {% if request.resolver_match.url_name in 'owner_contact_list owner_contact_detail' %}{% else %}d-none{% endif %}">
<a href="{% url 'owner_contact_list' %}">
<i class="fa-solid fa-tags"></i>
All Messages
</a>
</div>

<a href="{% url 'owner_coupon_list' %}" class="{% if request.resolver_match.url_name in 'owner_coupon_list owner_coupon_create owner_coupon_update' %}active-parent{% endif %}">
<i class="fa-solid fa-tags"></i>
<span class="menu-text">Coupons</span>
</a>

</aside>

<main class="content">
{% block content %}{% endblock %}
</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* TOGGLE */
function toggleSidebar(){

    const sidebar=document.getElementById("sidebar");
    const overlay=document.getElementById("sidebarOverlay");

    if(window.innerWidth < 768){

        sidebar.classList.remove("collapsed"); // 🔥 critical
        sidebar.classList.toggle("show");
        overlay.classList.toggle("active");

    }else{

        sidebar.classList.toggle("collapsed");
    }
}

/* CLOSE */
function closeSidebar(){
    document.getElementById("sidebar").classList.remove("show");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

/* RESET ON RESIZE — VERY IMPORTANT */
function handleResize(){

    const sidebar=document.getElementById("sidebar");
    const overlay=document.getElementById("sidebarOverlay");

    if(window.innerWidth < 768){

        sidebar.classList.remove("collapsed");

    }else{

        sidebar.classList.remove("show");
        overlay.classList.remove("active");
    }
}

window.addEventListener("load",handleResize);
window.addEventListener("resize",handleResize);

/* SUBMENU */
function toggleMenu(menuId,el){

    const menu=document.getElementById(menuId);
    const arrow=el.querySelector(".arrow");

    const isOpen=!menu.classList.contains("d-none");

    document.querySelectorAll(".submenu").forEach(m=>m.classList.add("d-none"));
    document.querySelectorAll(".arrow").forEach(a=>a.classList.remove("rotate"));

    if(!isOpen){
        menu.classList.remove("d-none");
        arrow.classList.add("rotate");
    }
}

/* AUTO CLOSE MOBILE */
document.querySelectorAll(".sidebar a").forEach(link=>{

    link.addEventListener("click",()=>{

        if(window.innerWidth < 768){
            closeSidebar();
        }

    });

});

</script>

</body>
</html>
