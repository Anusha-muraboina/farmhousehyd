<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Owner Dashboard{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100">

<!-- HEADER -->
<header class="bg-white shadow sticky top-0 z-50">
    <div class="flex justify-between items-center px-6 py-4">
        <div class="flex items-center gap-3">
            <button id="menuBtn" class="text-xl font-bold">☰</button>
            <h1 class="text-xl font-bold text-orange-600">
                Farmhouse Owner
            </h1>
        </div>

        <a href="{% url 'logout' %}"
           class="bg-orange-500 text-white px-4 py-2 rounded">
            Logout
        </a>
    </div>
</header>

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="sidebar"
           class="w-64 bg-white shadow-md transition-all duration-300">

        <nav class="p-6 space-y-3 text-sm font-medium">

            <a href="{% url 'owner_dashboard' %}"
               class="flex items-center gap-3 px-4 py-3 rounded hover:bg-orange-100">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>

            <a href="{% url 'owner_farmhouse' %}"
               class="flex items-center gap-3 px-4 py-3 rounded hover:bg-orange-100">
                <i data-lucide="home"></i>
                My Farmhouses
            </a>

            <a href="#"
               class="flex items-center gap-3 px-4 py-3 rounded hover:bg-orange-100">
                <i data-lucide="calendar"></i>
                Bookings
            </a>

            <a href="#"
               class="flex items-center gap-3 px-4 py-3 rounded hover:bg-orange-100">
                <i data-lucide="message-circle"></i>
                Messages
            </a>

        </nav>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-8">
        {% block content %}{% endblock %}
    </main>

</div>

<script>
    document.getElementById("menuBtn").onclick = () => {
        document.getElementById("sidebar").classList.toggle("hidden");
    }
    lucide.createIcons();
</script>

</body>
</html>
