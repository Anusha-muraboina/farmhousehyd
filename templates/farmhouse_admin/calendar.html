<!DOCTYPE html>
<html>
<head>
    <title>{{ farmhouse.title }} Calendar</title>

    <style>
        body {
            font-family: Arial;
            background: #f9fafb;
            padding: 20px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-box {
            height: 90px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 8px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.2s;
        }

        .day-box:hover {
            transform: scale(1.03);
        }

        /* 🔴 BOOKED */
        .booked {
            background: #ef4444;
            color: white;
            border: 2px solid red;
        }

        /* ⚫ BLOCKED */
        .blocked {
            background: #9ca3af;
            color: white;
            border: 2px solid gray;
        }

        /* 🚫 DISABLED */
        .disabled {
            pointer-events: none;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .price {
            font-size: 12px;
            text-align: right;
        }

        .date {
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 8px 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>{{ farmhouse.title }}</h2>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <button onclick="prevMonth()">⬅ Prev</button>
    <h3 id="monthYear"></h3>
    <button onclick="nextMonth()">Next ➡</button>
</div>
<div class="week-row">
    <div>Sun</div><div>Mon</div><div>Tue</div>
    <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>

<div id="calendarGrid" class="calendar-grid"></div>

<button onclick="shareCalendar()">Share Calendar</button>

<script>
function shareCalendar(){

    const url = `${window.location.origin}/farmhouse_admin/calendar/{{ farmhouse.slug }}/`;

    // 🔥 TRY MODERN API
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url)
            .then(() => alert("✅ Link copied!"))
            .catch(() => fallbackCopy(url));
    } else {
        fallbackCopy(url);
    }
}

// 🔥 FALLBACK (ALWAYS WORKS)
function fallbackCopy(text) {
    const input = document.createElement("input");
    input.value = text;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    document.body.removeChild(input);

    alert("✅ Link copied (fallback)!");
}
</script>
<script>

let currentDate = new Date();

function updateMonthTitle(){
    const monthYear = document.getElementById("monthYear");
    monthYear.innerText = currentDate.toLocaleString('default', {
        month: 'long',
        year: 'numeric'
    });
}

function nextMonth(){
    currentDate.setMonth(currentDate.getMonth() + 1);
    loadCalendar();
}

function prevMonth(){
    currentDate.setMonth(currentDate.getMonth() - 1);
    loadCalendar();
}


async function loadCalendar(){

    try {
        const res = await fetch(`/farmhouse_admin/bookings/blocked-dates/{{ farmhouse.slug }}/`);

        if(!res.ok){
            renderCalendar([]);
            return;
        }

    

        const data = await res.json();

        renderCalendar(data);

    } catch (e){
        console.error("Error:", e);
        renderCalendar([]);
    }
}

function renderCalendar(data){

    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    updateMonthTitle();

    let year = currentDate.getFullYear();
    let month = currentDate.getMonth();

    let firstDay = new Date(year, month, 1).getDay();
    let daysInMonth = new Date(year, month + 1, 0).getDate();

    for(let i=0;i<firstDay;i++){
        grid.innerHTML += `<div></div>`;
    }

    for(let day=1; day<=daysInMonth; day++){

        let dateObj = new Date(year, month, day);

        let dateStr = dateObj.getFullYear() + "-" +
                      String(dateObj.getMonth()+1).padStart(2,'0') + "-" +
                      String(dateObj.getDate()).padStart(2,'0');

        let found = data.find(d => d?.date === dateStr);

        let weekdayPrice = {{ farmhouse.pricing.normal_day_price|default:0 }};
        let weekendPrice = {{ farmhouse.pricing.weekend_price|default:0 }};

        let isWeekend = (dateObj.getDay() === 0 || dateObj.getDay() === 6);
        let price = isWeekend ? weekendPrice : weekdayPrice;

        let statusClass = "";
        let label = "";

        if(found){
            if(found.type === "booked"){
                statusClass = "booked disabled";
                label = "❌ Booked";
            }
            else if(found.type === "blocked"){
                statusClass = "blocked disabled";
                label = "🚫 Blocked";
            }
        }

        let div = document.createElement("div");
        div.className = `day-box ${statusClass}`;

        div.innerHTML = `
            <div class="date">${day}</div>
            <div class="price">
                ${label ? label : "₹" + price}
            </div>
        `;

        grid.appendChild(div);
    }
}

// 🔥 LOAD ON PAGE
document.addEventListener("DOMContentLoaded", loadCalendar);

</script>






</body>
</html>
