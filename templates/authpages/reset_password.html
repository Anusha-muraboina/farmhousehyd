{% extends "base.html" %}
{% block content %}

<div class="min-h-screen flex justify-center items-center">
<div class="bg-white p-8 w-96 rounded shadow">

<h2 class="text-xl font-bold mb-5">Reset Password</h2>

<input id="new_password" type="password"
class="w-full border p-3 mb-3 rounded"
placeholder="New password">

<input id="confirm_password" type="password"
class="w-full border p-3 mb-5 rounded"
placeholder="Confirm password">

<button onclick="resetPassword()"
class="w-full bg-orange-500 text-white py-3 rounded">
Reset Password
</button>

</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");
const token = params.get("token");

async function resetPassword(){
  const res = await fetch(`/api/forgot-password/?uid=${uid}&token=${token}`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      new_password: new_password.value,
      confirm_password: confirm_password.value
    })
  });

  const data = await res.json();
  alert(data.message || data.error);
}
</script>

{% endblock %}
