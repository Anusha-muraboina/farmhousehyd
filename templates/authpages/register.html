<section class="md:py-28 py-8 flex items-center justify-center px-4">

  <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl p-8">

    <!-- Logo -->
    <div class="text-center mb-8">
      <img src="{% static 'images/farmhousehyd.webp' %}"
           class="h-20 mx-auto mb-4"
           alt="Farmhouses Hyderabad">

      <h1 class="font-display text-3xl font-bold text-secondary">
        Create Account
      </h1>
      <p class="text-gray-500 text-sm mt-1">
        Join Farmhouses Hyderabad
      </p>
    </div>

    <!-- Register Form -->
    <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      {% csrf_token %}

      <!-- First Name -->
      <div class="relative">
        <i data-lucide="user"
           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
        <input type="text" name="first_name" required
               placeholder="First Name"
               class="w-full border border-gray-300 rounded-xl pl-12 px-4 py-3 focus:ring-2 focus:ring-primary outline-none">
      </div>

      <!-- Last Name -->
      <div class="relative">
        <i data-lucide="user"
           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
        <input type="text" name="last_name" required
               placeholder="Last Name"
               class="w-full border border-gray-300 rounded-xl pl-12 px-4 py-3 focus:ring-2 focus:ring-primary outline-none">
      </div>

      <!-- Phone -->
      <div class="relative md:col-span-2">
        <i data-lucide="phone"
           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
        <input type="tel" name="phone" required
               placeholder="Phone Number"
               class="w-full border border-gray-300 rounded-xl pl-12 px-4 py-3 focus:ring-2 focus:ring-primary outline-none">
      </div>

      <!-- Email -->
      <div class="relative md:col-span-2">
        <i data-lucide="mail"
           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
        <input type="email" name="email" required
               placeholder="Email Address"
               class="w-full border border-gray-300 rounded-xl pl-12 px-4 py-3 focus:ring-2 focus:ring-primary outline-none">
      </div>

      <!-- Password -->
      <div class="relative">
        <i data-lucide="lock"
           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>

        <input type="password" name="password1" id="password1" required
               placeholder="Password"
               class="w-full border border-gray-300 rounded-xl pl-12 pr-12 px-4 py-3 focus:ring-2 focus:ring-primary outline-none">

        <button type="button"
                onclick="togglePassword('password1', this)"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">
          <i data-lucide="eye" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <i data-lucide="lock"
           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>

        <input type="password" name="password2" id="password2" required
               placeholder="Confirm Password"
               class="w-full border border-gray-300 rounded-xl pl-12 pr-12 px-4 py-3 focus:ring-2 focus:ring-primary outline-none">

        <button type="button"
                onclick="togglePassword('password2', this)"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">
          <i data-lucide="eye" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Submit -->
      <button type="submit"
              class="md:col-span-2 bg-primary text-white py-3 rounded-xl font-medium hover:bg-orange-600 transition">
        Register
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Already have an account?
      <a href="{% url 'login' %}" class="text-primary font-medium hover:underline">
        Login
      </a>
    </p>

  </div>
</section>

<!-- Password Toggle Script -->
<script>
  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');

    if (input.type === "password") {
      input.type = "text";
      icon.setAttribute("data-lucide", "eye-off");
    } else {
      input.type = "password";
      icon.setAttribute("data-lucide", "eye");
    }
    lucide.createIcons();
  }

  lucide.createIcons();
</script>
