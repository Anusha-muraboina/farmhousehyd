{% extends "superadmin/base.html" %}
{% block content %}

<div class="d-flex justify-content-between mb-3">
    <h4>Property Rules</h4>

    <a href="{% url 'propertyrules_create' %}" class="btn btn-warning text-white">
        + Add Rule
    </a>
</div>

<form method="get" class="mb-3  bg-white p-3"  >
    <input type="text" name="q" value="{{ query }}"
           class="form-control" placeholder="Search rules...">
</form>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Name</th>
            <th>Slot</th>
            <th>Status</th>
            <th width="140">Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for r in rules %}
        <tr>
            <td>{{ r.name }}</td>
            <td>{{ r.slot_position }}</td>
            <td>
                {% if r.active %}
                    <span class="badge bg-success">Active</span>
                {% else %}
                    <span class="badge bg-secondary">Inactive</span>
                {% endif %}
            </td>
            <td>
                <a href="{% url 'propertyrules_update' r.id %}" class="btn btn-sm btn-warning text-white">Edit</a>

                <form method="post" action="{% url 'propertyrules_delete' r.id %}"
                      style="display:inline;"
                      onsubmit="return confirm('Delete rule?');">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center">No rules found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
