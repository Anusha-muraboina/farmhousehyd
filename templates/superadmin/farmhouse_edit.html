{% extends "superadmin/base.html" %}
{% block content %}

<h1 class="text-2xl font-bold mb-6">
  Edit: {{ farmhouse.title }}
</h1>

  {% csrf_token %}

  {{ form.as_p }}

  {{ pricing_form.as_p }}

    Update
  </button>
</form>

{% endblock %}
