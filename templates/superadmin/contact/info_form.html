{% extends "superadmin/base.html" %}
{% block content %}

<h4 class="fw-bold mb-4">{{ title }}</h4>

<form method="post" class="card shadow-sm border-0 p-4 col-lg-6">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label fw-semibold">Phone</label>
        {{ form.phone }}
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Primary Email</label>
        {{ form.email_1 }}
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Secondary Email</label>
        {{ form.email_2 }}
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Opening Time</label>
        {{ form.opening_time }}
    </div>

    <div class="form-check mb-4">
        {{ form.is_active }}
        <label class="form-check-label">Active</label>
    </div>

    <button class="btn btn-success px-4">Save</button>
    <a href="{% url 'contact_info_list' %}" class="btn btn-light">Cancel</a>
</form>

{% endblock %}
