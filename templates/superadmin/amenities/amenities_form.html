{% extends "superadmin/base.html" %}
{% block content %}

<div class="container-fluid">

<div class="card shadow-sm border-0 mx-auto" style="max-width:650px;">
<div class="card-body p-5">

<h4 class="fw-bold mb-4">
    {{ title }}
</h4>

<form method="POST">
{% csrf_token %}

<!-- NAME -->
<div class="mb-3">
<label class="form-label fw-semibold">
Amenity Name
</label>
{{ form.name }}
</div>

<!-- ICON -->
<div class="mb-4">
<label class="form-label fw-semibold">
Icon Class
</label>
{{ form.icon_class }}

<div class="form-text">
Use FontAwesome class. Example:
<b>fa-solid fa-wifi</b>
</div>

<!-- LIVE PREVIEW -->
<div class="mt-3">
Preview:
<i id="iconPreview" class="fs-3 text-warning"></i>
</div>

</div>

<button class="btn btn-warning px-4">
<i class="fa fa-save me-2"></i>
Save Amenity
</button>

<a href="{% url 'amenity-list' %}"
   class="btn btn-light ms-2">
Cancel
</a>

</form>

</div>
</div>

</div>


<!-- ICON LIVE PREVIEW SCRIPT -->
<script>

const iconInput = document.getElementById("id_icon_class");
const preview = document.getElementById("iconPreview");

function updateIcon(){
    preview.className = iconInput.value + " fs-3 text-warning";
}

iconInput.addEventListener("keyup", updateIcon);
window.onload = updateIcon;

</script>

{% endblock %}
