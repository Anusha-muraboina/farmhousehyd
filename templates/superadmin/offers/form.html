{% extends "superadmin/base.html" %}
{% block content %}

<!-- FLATPICKR CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow border-0 rounded-4">

                <!-- HEADER -->
                <div class="card-header bg-white border-0">
                    <h4 class="fw-bold mb-0"> Add / Edit Offer</h4>
                </div>

                <div class="card-body">

                    <form method="post">
                        {% csrf_token %}

                        <!-- FARMHOUSE -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Farmhouse</label>
                            {{ form.farmhouse }}
                        </div>

                        <!-- TITLE -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Offer Title</label>
                            {{ form.title }}
                        </div>

                        <!-- DATE RANGE PICKER -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Date Range</label>
                            <input type="text" id="date_range" class="form-control">
                        </div>

                        <!-- HIDDEN FIELDS -->
                        {{ form.start_date }}
                        {{ form.end_date }}

                        <!-- PRICE -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Offer Price (₹)</label>
                            {{ form.price }}
                        </div>

                        <!-- BUTTONS -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'owner_offer_list' %}" class="btn btn-light border px-4">
                                ← Back
                            </a>

                            <button type="submit" class="btn btn-success px-4">
                                Save Offer
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- FLATPICKR JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
flatpickr("#date_range", {
    mode: "range",
    dateFormat: "Y-m-d",
    minDate: "today",

    onChange: function(selectedDates, dateStr, instance) {
        if (selectedDates.length === 2) {
            let start = instance.formatDate(selectedDates[0], "Y-m-d");
            let end = instance.formatDate(selectedDates[1], "Y-m-d");

            document.getElementById("id_start_date").value = start;
            document.getElementById("id_end_date").value = end;
        }
    }
});
</script>

{% endblock %}
