{% extends "superadmin/base.html" %}
{% block content %}

<h2 class="text-xl font-semibold mb-6">About Section</h2>

<form method="post" enctype="multipart/form-data"
      class="bg-white p-6 rounded shadow max-w-2xl">

    {% csrf_token %}

    <div class="space-y-4">
        {{ form.as_p }}
    </div>

    <button
        class="mt-6 bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">
        Save
    </button>
</form>

{% endblock %}
