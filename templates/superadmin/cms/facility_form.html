{% extends "superadmin/base.html" %}
{% block content %}

<div class="container-fluid">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">
                {% if form.instance.pk %}
                    Edit Facility
                {% else %}
                    Add Facility
                {% endif %}
            </h4>
            <p class="text-muted mb-0">Manage facility master data</p>
        </div>

        <a href="{% url 'facilities_list' %}" class="btn btn-outline-secondary">
            ← Back
        </a>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="row">

            <div class="col-lg-6">

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <h6 class="text-uppercase text-muted fw-bold mb-3">
                            Facility Information
                        </h6>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Facility Name</label>
                            {{ form.name }}
                        </div>

                        <div class="form-check mt-3">
                            {{ form.is_active }}
                            <label class="form-check-label fw-semibold">
                                Active
                            </label>
                        </div>

                    </div>
                </div>

            </div>

        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'facilities_list' %}" class="btn btn-light px-4">
                Cancel
            </a>

            <button type="submit" class="btn btn-success px-5">
                💾 Save
            </button>
        </div>

    </form>

</div>

{% endblock %}
