{% extends "superadmin/base.html" %}
{% block content %}

<div class="container-fluid mt-4">

    <!-- PAGE HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">{{ title }}</h3>
            <small class="text-muted">
                Manage farmhouse facility details
            </small>
        </div>

        <a href="{% url 'facility-list' %}" class="btn btn-light shadow-sm">
            ← Back
        </a>
    </div>


    <!-- CARD -->
    <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-4">

            <form method="post">
                {% csrf_token %}

                <!-- FACILITY NAME -->
                <div class="mb-4">
                    <label class="form-label fw-semibold mb-2">
                        Facility Name
                    </label>
                    {{ form.name }}
                </div>


                <!-- ACTIVE STATUS -->
                <div class="form-check form-switch mb-4">
                    {{ form.active }}
                    <label class="form-check-label ms-2">
                        Active Facility
                    </label>
                </div>


                <!-- SAVE BUTTON -->
                <div class="text-end">
                    <button class="btn btn-warning px-5 py-2 text-white shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-2"></i>
                        Save Facility
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>


<style>

/* Form styling */
input[type="text"]{
    height:45px !important;
    border-radius:10px !important;
}

.card{
    max-width:700px;
    margin:auto;
}

</style>

{% endblock %}
