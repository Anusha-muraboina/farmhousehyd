{% extends "superadmin/base.html" %}
{% block content %}

<div class="max-w-xl bg-white p-10 rounded-xl shadow text-center">
  <h2 class="text-2xl font-bold text-red-600 mb-4">
    Delete Location
  </h2>

  <p class="mb-6">
    Delete <b>{{ obj.name }}</b>?
  </p>

  <form method="POST">
    {% csrf_token %}
    <a href="{% url 'location-list' %}" class="border px-6 py-2 rounded-xl mr-4">
      Cancel
    </a>
    <button class="bg-red-600 text-white px-6 py-2 rounded-xl">
      Delete
    </button>
  </form>
</div>

{% endblock %}
