<!DOCTYPE html>
<html>
<head>
  <title>Super Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<form method="POST"
      class="bg-white p-10 rounded-xl shadow w-96">

  {% csrf_token %}

  <h2 class="text-2xl font-bold mb-6 text-center">
    Super Admin Login
  </h2>

  <input name="email"
         type="email"
         placeholder="Email"
         class="w-full border p-3 mb-4 rounded">

  <input name="password"
         type="password"
         placeholder="Password"
         class="w-full border p-3 mb-4 rounded">

  <button class="w-full bg-orange-500 text-white py-3 rounded">
    Login
  </button>

  {% for message in messages %}
    <p class="text-red-500 text-sm mt-3 text-center">
      {{ message }}
    </p>
  {% endfor %}

</form>

</body>
</html>
