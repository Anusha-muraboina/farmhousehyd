{% extends "superadmin/base.html" %}
{% block content %}

<div class="container-fluid">

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="page-title">Blogs</h3>
    <small class="text-muted">Manage website blogs</small>
  </div>

  <a href="{% url 'blog_add' %}" class="btn btn-warning text-white">
    + Add Blog
  </a>
</div>

<div class="card shadow-sm">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Views</th>
        <th width="160">Action</th>
      </tr>
    </thead>

    <tbody>
      {% for blog in blogs %}
      <tr>
        <td>{{ blog.title }}</td>
        <td>
          {% if blog.is_published %}
            <span class="badge bg-success">Published</span>
          {% else %}
            <span class="badge bg-secondary">Draft</span>
          {% endif %}
        </td>
        <td>{{ blog.views }}</td>
        <td>
          <a href="{% url 'blog_edit' blog.id %}" class="btn btn-sm btn-primary">Edit</a>
          <a href="{% url 'blog_delete' blog.id %}" class="btn btn-sm btn-danger"
             onclick="return confirm('Delete blog?')">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

</div>
{% endblock %}
