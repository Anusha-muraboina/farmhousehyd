{% extends "superadmin/base.html" %}
{% block content %}

<div class="flex justify-between mb-6">
  <h1 class="text-2xl font-bold">Blogs</h1>
  <a href="{% url 'blog_add' %}"
     class="bg-emerald-600 text-white px-4 py-2 rounded">
    + Add Blog
  </a>
</div>

<table class="w-full bg-white shadow rounded">
  <tr class="bg-gray-100">
    <th class="p-3">Title</th>
    <th>Status</th>
    <th>Views</th>
    <th>Action</th>
  </tr>

  {% for blog in blogs %}
  <tr class="border-t">
    <td class="p-3">{{ blog.title }}</td>
    <td>
      {% if blog.is_published %}
        <span class="text-green-600">Published</span>
      {% else %}
        <span class="text-red-600">Draft</span>
      {% endif %}
    </td>
    <td>{{ blog.views }}</td>
    <td class="space-x-2">
      <a href="{% url 'blog_edit' blog.id %}" class="text-blue-600">Edit</a>
      <a href="{% url 'blog_delete' blog.id %}"
         onclick="return confirm('Delete blog?')"
         class="text-red-600">Delete</a>
    </td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
