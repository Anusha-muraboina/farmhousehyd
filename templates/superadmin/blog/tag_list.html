{% extends "superadmin/base.html" %}
{% block content %}

<div class="flex justify-between mb-6">
  <h1 class="text-2xl font-bold">Tags</h1>
  <a href="{% url 'tag_add' %}"
     class="bg-emerald-600 text-white px-4 py-2 rounded">
    + Add Tag
  </a>
</div>

<table class="w-full bg-white shadow rounded">
  <tr class="bg-gray-100">
    <th class="p-3 text-left">Name</th>
    <th>Action</th>
  </tr>

  {% for tag in tags %}
  <tr class="border-t">
    <td class="p-3">{{ tag.name }}</td>
    <td class="space-x-3">
      <a href="{% url 'tag_edit' tag.id %}" class="text-blue-600">Edit</a>
      <a href="{% url 'tag_delete' tag.id %}"
         onclick="return confirm('Delete tag?')"
         class="text-red-600">Delete</a>
    </td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
