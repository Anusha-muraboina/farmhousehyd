{% extends "superadmin/base.html" %}

{% block content %}

<div class="flex justify-between mb-6">
  <h1 class="text-2xl font-bold">Blog Categories</h1>
  <a href="{% url 'category_add' %}"
     class="bg-emerald-600 text-white px-4 py-2 rounded">
    + Add Category
  </a>
</div>

<table class="w-full bg-white shadow rounded">
  <tr class="bg-gray-100">
    <th class="p-3 text-left">Name</th>
    <th>Status</th>
    <th>Action</th>
  </tr>

  {% for cat in categories %}
  <tr class="border-t">
    <td class="p-3">{{ cat.name }}</td>
    <td>
      {% if cat.is_active %}
        <span class="text-green-600">Active</span>
      {% else %}
        <span class="text-red-600">Inactive</span>
      {% endif %}
    </td>
    <td class="space-x-2">
      <a href="{% url 'category_edit' cat.id %}" class="text-blue-600">Edit</a>
      <a href="{% url 'category_delete' cat.id %}"
         class="text-red-600"
         onclick="return confirm('Delete this category?')">Delete</a>
    </td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
