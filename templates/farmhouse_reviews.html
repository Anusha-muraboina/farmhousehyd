{% extends "base.html" %}
{% block title %}Farmhouses Hyderabad - Best Farmhouses{% endblock %}
{% block content %}


<h2 class="text-2xl font-bold px-2 md:px-16 mb-2 md:mb-6">
Reviews for {{ farmhouse.title }}
</h2>

<div class="space-y-4 px-2 md:px-16  md:py-8 py-2 ">

{% for r in reviews %}

<div class="border rounded-xl p-4 bg-white shadow-sm">

<div class="flex justify-between">

<div>
<p class="font-semibold">{{ r.user.username }}</p>
<p class="text-yellow-500">
{{ r.rating }} ⭐
</p>
</div>

<span class="text-xs text-gray-500">
{{ r.created_at|date:"d M Y" }}
</span>

</div>

<p class="mt-2 text-gray-600">
{{ r.review }}
</p>

</div>

{% endfor %}

</div>


{% endblock %}
