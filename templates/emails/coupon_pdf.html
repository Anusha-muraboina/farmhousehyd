<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Farmhouse Coupon</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1000px 600px at 10% 10%, #e9f7ef 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 90%, #fff4e0 0%, transparent 60%),
      #f5f7fa;
    font-family: 'Inter', sans-serif;
    padding: 40px 16px;
    color: #1f2937;
  }

  .ticket {
    position: relative;
    width: 100%;
    max-width: 720px;
    display: flex;
    background: #ffffff;
    border-radius: 22px;
    box-shadow:
      0 30px 60px -25px rgba(16, 24, 40, 0.25),
      0 10px 25px -10px rgba(16, 24, 40, 0.1);
    overflow: hidden;
  }

  /* Decorative notches between left & right */
  .ticket::before,
  .ticket::after {
    content: "";
    position: absolute;
    width: 28px;
    height: 28px;
    background: #f5f7fa;
    border-radius: 50%;
    left: calc(62% - 14px);
  }
  .ticket::before { top: -14px; }
  .ticket::after  { bottom: -14px; }

  /* LEFT */
  .left {
    flex: 0 0 62%;
    padding: 36px 36px 32px;
    background:
      linear-gradient(135deg, #ffffff 0%, #f9fdf9 100%);
    position: relative;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: #ecfdf5;
    color: #047857;
    border: 1px solid #a7f3d0;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 4px rgba(16,185,129,0.15);
  }

  .title {
    margin-top: 16px;
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.15;
    color: #111827;
  }

  .farmhouse {
    margin-top: 14px;
    font-size: 14px;
    color: #6b7280;
    line-height: 1.6;
  }
  .farmhouse strong {
    color: #111827;
    font-weight: 600;
  }

  .discount-row {
    margin-top: 26px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .discount {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 800;
    background: linear-gradient(135deg, #059669 0%, #f59e0b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .discount-label {
    font-size: 14px;
    font-weight: 600;
    color: #6b7280;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .valid {
    margin-top: 22px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: #fff7ed;
    color: #b45309;
    border: 1px dashed #fdba74;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
  }
  .valid svg { width: 14px; height: 14px; }

  /* RIGHT */
  .right {
    flex: 1;
    background:
      repeating-linear-gradient(
        45deg,
        #f9fafb 0 12px,
        #f3f4f6 12px 24px
      );
    border-left: 2px dashed #d1d5db;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    text-align: center;
    gap: 14px;
  }

  .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #9ca3af;
    text-transform: uppercase;
  }

  .code-box {
    background: #ffffff;
    border: 2px dashed #10b981;
    border-radius: 12px;
    padding: 14px 22px;
    font-family: 'Inter', monospace;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #065f46;
    box-shadow: 0 6px 16px -8px rgba(16,185,129,0.4);
  }

  .copy-btn {
    margin-top: 4px;
    border: none;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px -8px rgba(16,185,129,0.6);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .copy-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 24px -10px rgba(16,185,129,0.7);
  }

  .terms {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 4px;
  }

  /* Responsive */
  @media (max-width: 620px) {
    .ticket { flex-direction: column; }
    .ticket::before, .ticket::after { display: none; }
    .right {
      border-left: none;
      border-top: 2px dashed #d1d5db;
    }
    .left { padding: 28px; }
    .title { font-size: 24px; }
    .discount { font-size: 42px; }
  }
</style>
</head>
<body>

  <div class="ticket">

    <!-- LEFT -->
    <div class="left">
      <span class="badge"><span class="dot"></span> Farmhouse Coupon</span>

      <h1 class="title">{{ farmhouse.title }}</h1>

      <p class="farmhouse">
        <strong>Location</strong><br>
        {{ farmhouse.address }}
      </p>

      <div class="discount-row">
        <div class="discount">
          {% if coupon.discount_type == "flat" %}
            ₹{{ coupon.discount_value }}
          {% else %}
            {{ coupon.discount_value }}%
          {% endif %}
        </div>
        <div class="discount-label">OFF</div>
      </div>

      <div class="valid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        Valid till {{ coupon.end_date }}
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="label">Coupon Code</div>
      <div class="code-box">{{ coupon.code }}</div>
      <button class="copy-btn" onclick="navigator.clipboard && navigator.clipboard.writeText(this.previousElementSibling.innerText.trim())">
        Copy Code
      </button>
      <div class="terms">*T&amp;C apply</div>
    </div>

  </div>

</body>
</html>
