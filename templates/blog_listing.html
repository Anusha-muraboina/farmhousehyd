{% extends "base.html" %}
{% block content %}
  {% comment %} <style>

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Playfair Display', serif;
    }
    .blog-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .tag-chip:hover {
      background-color: #22a855;
      color: white;
    }
    .view-post:hover {
      color: #1a8a44;
    }
    .view-post:hover svg {
      transform: translateX(4px);
    }
  </style> {% endcomment %}

<div class=" p-16 mx-auto grid lg:grid-cols-3 gap-8">

  <!-- BLOG LIST -->
  <div class="lg:col-span-2 space-y-8" id="blogList"></div>

  <!-- SIDEBAR -->
  <aside class="space-y-6 bg-white md:p-6 p-2 rounded">

    <!-- SEARCH -->
    <input id="searchInput"
           placeholder="Search..."
           class="w-full border p-3 rounded">

    <!-- CATEGORIES -->
    <div>
      <h3 class="font-bold mb-3">Categories</h3>
      <ul id="categoryList" class="space-y-2"></ul>
    </div>


    <!-- TAGS -->
    <div>
      <h3 class="font-bold mb-3">Tags</h3>
      <div id="tagList" class="flex flex-wrap gap-2"></div>
    </div>


        <!-- RECENT -->
    <div>
      <h3 class="font-bold mb-3">Recent Posts</h3>
      <div id="recentBlogs" class="space-y-4"></div>
    </div>

  </aside>
</div>


<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
const params = new URLSearchParams(window.location.search);

/* ================= BLOGS ================= */

function loadBlogs() {
  axios.get("/blogs/api/blogs/?" + params.toString())
    .then(res => {
      const box = document.getElementById("blogList");
      box.innerHTML = "";

      res.data.forEach(blog => {
        box.innerHTML += `
          <article class="bg-white rounded shadow">
            <img src="${blog.image}" class="w-full h-64 object-cover">
            <div class="p-6">
              <h2 class="text-xl font-bold mb-2">
                <a href="/blogs/${blog.slug}/">${blog.title}</a>
              </h2>
              <p class="text-gray-600 mb-4">${blog.short_description}</p>
              <a href="/blogs/blogs/${blog.slug}/" class="text-primary font-semibold">
                View Post →
              </a>
            </div>
          </article>
        `;
      });
    });
}

/* ================= CATEGORIES ================= */

axios.get("/blogs/api/blog-categories/")
  .then(res => {
    const box = document.getElementById("categoryList");
    res.data.forEach(cat => {
      box.innerHTML += `
        <li>
          <a href="?category=${cat.slug}">
            ${cat.name} (${cat.blog_count})
          </a>
        </li>
      `;
    });
  });

/* ================= TAGS ================= */

axios.get("/blogs/api/blog-tags/")
  .then(res => {
    const box = document.getElementById("tagList");
    res.data.forEach(tag => {
      box.innerHTML += `
        <a href="?tag=${tag.slug}"
           class="px-3 py-1 bg-gray-100 rounded hover:bg-primary hover:text-white">
          ${tag.name}
        </a>
      `;
    });
  });

/* ================= RECENT ================= */

axios.get("/blogs/api/blogs-recent/")
  .then(res => {
    const box = document.getElementById("recentBlogs");
    res.data.forEach(post => {
      box.innerHTML += `
        <div class="flex gap-3">
          <img src="${post.image}" class="w-16 h-14 object-cover rounded">
          <a href="/blogs/${post.slug}" class="text-sm font-medium">
            ${post.title}
          </a>
        </div>
      `;
    });
  });

loadBlogs();
</script>

{% endblock %}
