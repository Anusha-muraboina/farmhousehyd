{% extends "base.html" %}
{% block content %}

<div class="bg-[#fafafa] py-16">

<div class="max-w-7xl mx-auto px-6">

<!-- HEADER -->
<div class="mb-14 text-center">
<h1 class="text-5xl font-extrabold text-gray-800 mb-3">
Our Blog
</h1>

<h2 class="text-gray-500 text-lg">
Travel tips, farmhouse guides, and getaway inspiration
</h2>
</div>



<div class="grid lg:grid-cols-12 gap-12">

<!-- ================= BLOGS ================= -->

<div id="blogList"
class="lg:col-span-8 grid md:grid-cols-1 gap-10">
</div>



<!-- ================= SIDEBAR ================= -->

<aside class="lg:col-span-4 space-y-8">

<!-- SEARCH -->
<div class="bg-white p-6 rounded-2xl shadow-sm border">

<input id="searchInput"
placeholder="Search blogs..."
class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-400 outline-none"
value="{{ request.GET.search|default:'' }}">

</div>



<!-- CATEGORIES -->
<div class="bg-white p-6 rounded-2xl shadow-sm border">

<h3 class="font-bold text-lg mb-4">
Categories
</h3>

<ul id="categoryList" class="space-y-3 text-gray-600"></ul>

</div>



<!-- RECENT -->
<div class="bg-white p-6 rounded-2xl shadow-sm border">

<h3 class="font-bold text-lg mb-4">
Recent Posts
</h3>

<div id="recentBlogs" class="space-y-4"></div>

</div>



<!-- TAGS -->
<div class="bg-white p-6 rounded-2xl shadow-sm border">

<h3 class="font-bold text-lg mb-4">
Popular Tags
</h3>

<div id="tagList" class="flex flex-wrap gap-2"></div>

</div>

</aside>

</div>
</div>
</div>



<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

////////////////////////////////////////////////////////////
// LOAD BLOGS
////////////////////////////////////////////////////////////

function loadBlogs(){

axios.get("/blogs/api/blogs/?" + params.toString())
.then(res=>{

const box = document.getElementById("blogList");

box.innerHTML="";

if(res.data.length===0){

box.innerHTML=`
<div class="col-span-2 text-center py-20">

<p class="text-2xl font-bold mb-3">
No blogs found 😔
</p>

<a href="/blogs/"
class="bg-orange-500 text-white px-6 py-3 rounded-xl">
View All Blogs
</a>

</div>
`;

return;
}


res.data.forEach(blog=>{

box.innerHTML+=`

<!-- BLOG CARD -->

<article
class="group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl transition duration-300 border">

<div class="overflow-hidden">

<img src="${blog.image}"
class="h-60 w-full object-cover group-hover:scale-110 transition duration-500">

</div>

<div class="p-6">

<!-- CATEGORY -->
<p class="text-orange-500 font-semibold text-sm mb-2">
${blog.category?.name ?? ""}
</p>

<p class="text-xl font-bold mb-2 group-hover:text-orange-600 transition">
<a href="/blogs/blogs/${blog.slug}/">
${blog.title}
</a>
</p>

<p class="text-gray-500 text-sm mb-4 line-clamp-3">
${blog.short_description}
</p>

<div class="flex justify-between items-center text-sm text-gray-400">

<span>
📅 ${new Date(blog.published_at).toDateString()}
</span>

<span>
⏱ ${blog.read_time} min
</span>

</div>

</div>
</article>
`;

});

});

}

loadBlogs();

////////////////////////////////////////////////////////////
// SEARCH
////////////////////////////////////////////////////////////

document.getElementById("searchInput")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){

const value=this.value.trim();

if(value){
window.location.href=`/blogs/?search=${encodeURIComponent(value)}`;
}else{
window.location.href="/blogs/";
}

}

});

////////////////////////////////////////////////////////////
// CATEGORIES
////////////////////////////////////////////////////////////

axios.get("/blogs/api/blog-categories/")
.then(res=>{

const box=document.getElementById("categoryList");

res.data.forEach(cat=>{

box.innerHTML+=`
<li>

<a href="?category=${cat.slug}"
class="hover:text-orange-600 transition flex justify-between">

<span>${cat.name}</span>

<span class="text-gray-400">
(${cat.blog_count})
</span>

</a>

</li>
`;

});

});

////////////////////////////////////////////////////////////
// TAGS
////////////////////////////////////////////////////////////

axios.get("/blogs/api/blog-tags/")
.then(res=>{

const box=document.getElementById("tagList");

res.data.forEach(tag=>{

box.innerHTML+=`
<a href="?tag=${tag.slug}"
class="px-3 py-1 bg-gray-100 rounded-full text-sm hover:bg-orange-500 hover:text-white transition">
${tag.name}
</a>
`;

});

});

////////////////////////////////////////////////////////////
// RECENT
////////////////////////////////////////////////////////////

axios.get("/blogs/api/blogs-recent/")
.then(res=>{

const box=document.getElementById("recentBlogs");

res.data.forEach(post=>{

box.innerHTML+=`
<a href="/blogs/blogs/${post.slug}/"
class="flex gap-3 items-center group">

<img src="${post.image}"
class="w-20 h-16 object-cover rounded-lg">

<span class="text-sm font-semibold group-hover:text-orange-600 transition">
${post.title}
</span>

</a>
`;

});

});

</script>

{% endblock %}
